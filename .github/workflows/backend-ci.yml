# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: POT Back-end Testing 

on:
  push:
    branches: "**"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # This starts the PostgreSQL container and exposes it to the runner.
    services:
      postgres_db: # Service name (used internally)
        # Uses the image defined in docker-compose.yml
        image: postgres:15-alpine
        env:
          # These MUST match the credentials in your local .env file
          # And will be changed when the project is deployed
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: POT_db
        ports:
          # Expose the port so the runner can connect via 'localhost:5432'
          - 5432:5432
        options: |
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with: 
          version: "0.9.11"
          enable-cache: true

    - name: Set up Python
      run: uv python install 

    - name: Install Backend dependencies
      run: |
        uv sync

    - name: Set DB Environment Variables for CI
      run: |
        # Set the environment variables your src/config.py needs.
        # The host is 'localhost' because the ports are exposed via the 'services' block.
        echo "POSTGRES_USER=postgres" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=devpassword" >> $GITHUB_ENV
        echo "POSTGRES_DB=POT_db" >> $GITHUB_ENV
        echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV 
        echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
        
    - name: Wait for PostgreSQL Service to be Healthy
  # This uses a loop to repeatedly check the container health status
      run: |
        # The service name defined in the 'services' block
        SERVICE_NAME="postgres_db" 
        MAX_ATTEMPTS=15
        ATTEMPT=0
        
        echo "Waiting for ${SERVICE_NAME} to accept connections on 5432..."
        
        # Loop until the check succeeds or max attempts are reached
        until [ "$(docker inspect --format '{{.State.Health.Status}}' $SERVICE_NAME)" == "healthy" ]; do
          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "Error: PostgreSQL service did not become healthy within 60 seconds."
            exit 1
          fi
          
          echo "Attempt $((ATTEMPT + 1)) of ${MAX_ATTEMPTS}: DB is not yet healthy. Waiting..."
          sleep 4
          ATTEMPT=$((ATTEMPT + 1))
        done
        
        echo "✅ PostgreSQL service is now healthy!"
        
    - name: Apply Alembic Migrations
      # Run migrations to create the table structure required by the tests.
      run: |
        uv run dotenv run alembic upgrade head

    - name: Lint with ruff
      run: |
        uv run ruff check .

    - name: Format check with ruff
      run: |
        uv run ruff format --check .

    - name: Test with pytest
      run: |
        uv run pytest
