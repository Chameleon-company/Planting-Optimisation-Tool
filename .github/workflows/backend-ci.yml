# This workflow will install Python dependencies, run tests and lint with a single version of Python
          
          
name: POT Back-end Testing 
          
          
on:
  push:
    branches: "**"
  pull_request:
    branches: [ "master" ]
          
          
permissions:
  contents: read
          
          
jobs:
  build:
    
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    # ====================================================================
    # 1. DATABASE SERVICE SETUP
    # Starts the PostgreSQL container and exposes it to the runner.
    # The 'options' are set on a single line to avoid YAML parsing bugs.
    # ====================================================================
    services:
      postgres_db: # Service name
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: POT_db
        ports:
          # Expose the port so the runner can connect via 'localhost:5432'
          - 5432:5432
        options: "--health-cmd \"pg_isready -U postgres\" --health-interval 10s --health-timeout 5s --health-retries 5"
    
    # ====================================================================
    # 2. WORKFLOW STEPS
    # ====================================================================
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with: 
          version: "0.9.11"
          enable-cache: true
    
    - name: Set up Python
      run: uv python install 
    
    - name: Install Backend dependencies
      run: |
        uv sync
    
    - name: Set DB Environment Variables for CI
      run: |
        # Set the environment variables your src/config.py needs.
        # The host is 'localhost' because the ports are exposed via the 'services' block.
        echo "POSTGRES_USER=postgres" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=devpassword" >> $GITHUB_ENV
        echo "POSTGRES_DB=POT_db" >> $GITHUB_ENV
        echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV 
        echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
        
    - name: Wait for PostgreSQL Service to be Healthy
      run: |
        SERVICE_NAME="postgres_db" 
        MAX_ATTEMPTS=15
        ATTEMPT=0
        
        echo "Waiting for ${SERVICE_NAME} to accept connections on 5432..."
        
        # Use 'pg_isready' directly against the network alias (DNS name)
        # The 'pg_isready' utility must be installed on the runner OS for this to work.
        until pg_isready -h $SERVICE_NAME -p 5432 -U postgres -t 1; do
          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "Error: PostgreSQL service did not become healthy within 60 seconds."
            exit 1
          fi
          
          echo "Attempt $((ATTEMPT + 1)) of ${MAX_ATTEMPTS}: DB is not yet healthy. Waiting..."
          sleep 4
          ATTEMPT=$((ATTEMPT + 1))
        done
        
        echo "PostgreSQL service is now healthy!"
        
    # 4. APPLY MIGRATIONS
    - name: Apply Alembic Migrations
      run: |
        uv run dotenv run alembic upgrade head
    
    # 5. LINT AND FORMAT
    - name: Lint with ruff
      run: |
        uv run ruff check .
    
    - name: Format check with ruff
      run: |
        uv run ruff format --check .
    
    # 6. RUN TESTS
    - name: Test with pytest
      run: |
        uv run pytest